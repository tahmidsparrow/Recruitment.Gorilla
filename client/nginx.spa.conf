# Served behind the gateway, which already strips the /ats prefix before
# proxying here — this container's own root is "/". See deploy/nginx/nginx.conf
# in gorilla-platform for the prefix-stripping side of this contract.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
